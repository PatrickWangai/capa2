<svg viewBox="-60 -60 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Capa">
  <!-- White mark on a transparent ground. Note this is invisible against light
       browser chrome; the tile that used to make it legible there is gone by
       request. apple-touch-icon and the android icons keep their solid ground,
       because those are composited onto a home-screen tile where transparency
       renders as a white or black box. -->
  <path d="M 40.6 11.7 A 42.25 42.25 0 1 1 40.6 -11.7"
        fill="none" stroke="#ffffff" stroke-width="15.5" stroke-linecap="butt"/>
  <circle r="24.1" fill="#ffffff"/>
</svg>
