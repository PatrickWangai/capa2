<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>Capa — Invest in Kenyan Companies </title>
    <meta name="description" content="Capa is a regulated investment platform that lets you trade Kenyan stocks — simply, securely and affordably from anywhere." />
    <meta name="keywords" content="invest Africa, stocks Kenya, global investment, trading platform, Nairobi Stock Exchange, M-Pesa investing" />
    <meta name="theme-color" content="#f2f7f6" />

    <!-- Open Graph (social sharing) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://capa-q1nh-fx87.onrender.com/" />
    <meta property="og:title" content="Capa — Invest Globally " />
    <meta property="og:description" content="Trade globaly. Real-time data, instant execution, M-Pesa deposits. Open your account in under 10 minutes." />
    <meta property="og:image" content="https://capa-q1nh-fx87.onrender.com/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Capa — Invest Globally" />
    <meta name="twitter:description" content="Trade global markets. Real-time data, instant execution, M-Pesa deposits." />
    <meta name="twitter:image" content="https://capa-q1nh-fx87.onrender.com/og-image.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://capa-q1nh-fx87.onrender.com/" />

    <!-- Performance: preconnect only to what we actually load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Archivo:wght@700;800;900&family=Caveat:wght@600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Apply saved light/dark mode before React loads to prevent a flash of the wrong theme. -->
    <script>
      (function(){
        var mode = localStorage.getItem('capa-color-mode');
        if (mode !== 'dark' && mode !== 'light') mode = 'light';
        document.documentElement.setAttribute('data-theme', mode);
        if (mode === 'light') document.documentElement.setAttribute('data-color-mode', 'light');
      })();
    </script>

    <!-- GitHub Pages SPA routing fix -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location));
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
