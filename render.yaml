databases:
  - name: capa-db
    plan: free
    region: frankfurt

services:
  - type: web
    name: capa
    runtime: node
    plan: free
    region: frankfurt
    autoDeploy: true
    # --include=dev is required here: NODE_ENV=production makes `npm ci`
    # skip devDependencies, but `next build` needs tailwindcss/@tailwindcss/
    # postcss and typescript to run at all. Moving only the packages needed
    # at runtime (dotenv, tsx, prisma) to dependencies wasn't enough — build
    # tooling needs to be present too.
    buildCommand: npm ci --include=dev && npm run build
    # Deliberately does NOT run `npm run db:seed` on every start — the seed
    # script wipes and recreates demo data, which would erase every real
    # signup/trade on each restart. Run it once manually (Render shell) after
    # the first deploy to populate initial demo assets/users, then leave it.
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: capa-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        sync: false
      - key: BROKER_PROVIDER
        value: mock
      - key: MARKET_DATA_PROVIDER
        value: mock
      - key: PAYMENT_PROVIDER
        value: mock
      - key: KYC_PROVIDER
        value: mock
